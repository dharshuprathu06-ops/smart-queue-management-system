<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Token</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

            <form action="/track-token" method="POST">

                       placeholder="Example: B001"
                       required>

                <button type="submit">

            </form>

        </div>

    </div>
